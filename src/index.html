<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Screen Record</title>
<style>
  :root {
    --bg: #1a1c22; --panel: #23262e; --accent: #3b82f6; --accent2: #ef4444;
    --text: #e5e7eb; --muted: #9ca3af; --border: #343845;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", sans-serif; font-size: 14px; }
  .container { max-width: 860px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label { color: var(--muted); }
  select, input[type=number], input[type=text] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  input[type=checkbox] { accent-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 20px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: #3f4451; }
  button.danger { background: var(--accent2); }
  button.warn { background: #d97706; }
  #recordBtn { font-size: 16px; padding: 12px 36px; }
  #timer { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; color: var(--accent2); min-width: 90px; }
  #timer.paused { color: #d97706; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; display: inline-block; margin-right: 6px; }
  .status-dot.rec { background: var(--accent2); animation: blink 1s infinite; }
  .status-dot.paused { background: #d97706; }
  @keyframes blink { 50% { opacity: .3; } }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
  td.path { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <h1>⏺ Screen Record</h1>

  <div class="card">
    <h2>录制源</h2>
    <div class="row">
      <select id="sourceKind">
        <option value="screen">全屏 / 显示器</option>
        <option value="window">窗口</option>
        <option value="region">区域</option>
      </select>
      <select id="sourceId" style="min-width:260px"></select>
      <span id="regionInputs" style="display:none" class="row">
        <label>X</label><input type="number" id="rx" value="0" style="width:70px">
        <label>Y</label><input type="number" id="ry" value="0" style="width:70px">
        <label>W</label><input type="number" id="rw" value="1280" style="width:80px">
        <label>H</label><input type="number" id="rh" value="720" style="width:80px">
      </span>
    </div>
    <div class="hint" id="wgcHint"></div>
  </div>

  <div class="card">
    <h2>视频与画质</h2>
    <div class="row">
      <label>帧率</label>
      <select id="fps"><option>15</option><option selected>30</option><option>60</option></select>
      <label>编码器</label>
      <select id="codec">
        <option value="h264">H.264 (兼容)</option>
        <option value="h265">H.265/HEVC (更小更清晰)</option>
      </select>
      <label>质量</label>
      <select id="quality">
        <option value="low">低 (小文件)</option>
        <option value="medium">中</option>
        <option value="high" selected>高 (推荐)</option>
        <option value="custom">自定义码率</option>
      </select>
      <input type="number" id="bitrateKbps" value="8000" style="width:90px; display:none">
      <label>码率模式</label>
      <select id="rateMode"><option value="vbr" selected>VBR</option><option value="cbr">CBR</option></select>
    </div>
    <div class="hint" id="bitrateHint"></div>
  </div>

  <div class="card">
    <h2>音频</h2>
    <div class="row">
      <label><input type="checkbox" id="sysAudio" checked> 系统声音</label>
      <label>音量 <input type="number" id="sysVol" min="0" max="2" step="0.1" value="1" style="width:60px"></label>
      <label><input type="checkbox" id="micAudio"> 麦克风</label>
      <label>音量 <input type="number" id="micVol" min="0" max="2" step="0.1" value="1" style="width:60px"></label>
    </div>
  </div>

  <div class="card">
    <h2>其他</h2>
    <div class="row">
      <label><input type="checkbox" id="showCursor" checked> 捕获鼠标光标</label>
      <label>最长时长(秒, 0=不限) <input type="number" id="maxDur" value="0" style="width:70px"></label>
      <label>最大文件(MB, 0=不限) <input type="number" id="maxFile" value="0" style="width:70px"></label>
      <label>输出目录 <input type="text" id="outDir" placeholder="默认 Videos/ScreenRecord" style="width:220px"></label>
    </div>
    <div class="hint">热键：Alt+R 开始/停止 · Alt+P 暂停/恢复</div>
  </div>

  <div class="card" style="text-align:center">
    <div class="row" style="justify-content:center; gap:18px">
      <span class="status-dot" id="statusDot"></span>
      <span id="timer">00:00</span>
      <button id="recordBtn" class="danger">● 开始录制</button>
      <button id="pauseBtn" class="warn" disabled>⏸ 暂停</button>
      <button id="stopBtn" class="secondary" disabled>■ 停止</button>
    </div>
    <div class="hint" id="statusHint"></div>
  </div>

  <div class="card">
    <h2>录制历史</h2>
    <table id="history"><tbody></tbody></table>
  </div>
</div>

<script>
const invoke = window.__TAURI__.core.invoke;
let recording = false;
let timerHandle = null;

const $ = id => document.getElementById(id);

async function loadSources() {
  const s = await invoke('list_sources');
  $('wgcHint').textContent = s.wgc_supported
    ? `检测到 ${s.monitors.length} 个显示器，WGC 捕获可用`
    : '⚠ 当前系统不支持 Windows.Graphics.Capture（需 Win10 1903+）';
  const sel = $('sourceId');
  sel.innerHTML = '';
  if ($('sourceKind').value === 'window') {
    for (const w of s.windows) {
      const o = document.createElement('option');
      o.value = w.hwnd; o.textContent = w.title.slice(0, 70);
      sel.appendChild(o);
    }
  } else {
    for (const m of s.monitors) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = `${m.name} — ${m.width}×${m.height}${m.is_primary ? ' (主屏)' : ''}`;
      sel.appendChild(o);
    }
  }
}

function fillSettings(s) {
  $('sourceKind').value = s.source_kind;
  $('fps').value = s.fps;
  $('codec').value = s.codec;
  $('quality').value = s.quality;
  $('bitrateKbps').value = s.bitrate_kbps;
  $('rateMode').value = s.rate_mode;
  $('sysAudio').checked = s.record_system_audio;
  $('micAudio').checked = s.record_microphone;
  $('sysVol').value = s.system_volume;
  $('micVol').value = s.mic_volume;
  $('maxDur').value = s.max_duration_secs;
  $('maxFile').value = s.max_file_mb;
  $('outDir').value = s.output_dir || '';
  $('showCursor').checked = s.show_cursor;
  if (s.source_id) $('sourceId').value = s.source_id;
  $('rx').value = s.region[0]; $('ry').value = s.region[1];
  $('rw').value = s.region[2]; $('rh').value = s.region[3];
  updateQualityUI();
  loadSources();
}

function collectSettings() {
  return {
    source_kind: $('sourceKind').value,
    source_id: $('sourceId').value,
    region: [+$('rx').value, +$('ry').value, +$('rw').value, +$('rh').value],
    fps: +$('fps').value,
    scale_width: 0,
    codec: $('codec').value,
    quality: $('quality').value,
    bitrate_kbps: +$('bitrateKbps').value,
    rate_mode: $('rateMode').value,
    record_system_audio: $('sysAudio').checked,
    record_microphone: $('micAudio').checked,
    system_volume: +$('sysVol').value,
    mic_volume: +$('micVol').value,
    output_dir: $('outDir').value || null,
    max_duration_secs: +$('maxDur').value,
    max_file_mb: +$('maxFile').value,
    show_cursor: $('showCursor').checked,
    click_highlight: true,
    countdown_secs: 0,
    hotkey_start_stop: 'Alt+R',
    hotkey_pause: 'Alt+P',
  };
}

async function persist() {
  await invoke('save_settings', { settings: collectSettings() });
}

function updateQualityUI() {
  $('bitrateKbps').style.display = $('quality').value === 'custom' ? '' : 'none';
}

async function loadHistory() {
  const list = await invoke('list_recordings');
  const tb = $('history').querySelector('tbody');
  tb.innerHTML = '';
  for (const h of list) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="path" title="${h.path}">${h.path.split(/[\\/]/).pop()}</td>
      <td>${h.size_mb.toFixed(1)} MB</td><td>${h.modified}</td>
      <td><a href="#" onclick="openIn(\`${h.path.replace(/\\/g, '\\\\')}\`);return false">打开</a></td>`;
    tb.appendChild(tr);
  }
}
window.openIn = p => invoke('open_file', { path: p });

function fmt(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function setUI(state) {
  const dot = $('statusDot');
  dot.className = 'status-dot' + (state === 'recording' ? ' rec' : state === 'paused' ? ' paused' : '');
  $('recordBtn').disabled = recording;
  $('pauseBtn').disabled = !recording;
  $('stopBtn').disabled = !recording;
  $('pauseBtn').textContent = state === 'paused' ? '▶ 恢复' : '⏸ 暂停';
  const timer = $('timer');
  timer.className = state === 'paused' ? 'paused' : '';
}

$('recordBtn').onclick = async () => {
  try {
    await persist();
    const path = await invoke('start_recording');
    recording = true;
    setUI('recording');
    $('statusHint').textContent = '录制中 → ' + path;
    timerHandle = setInterval(async () => {
      const p = await invoke('recording_progress');
      if (p) { $('timer').textContent = fmt(p.duration_secs); setUI(p.state); }
    }, 500);
  } catch (e) { $('statusHint').textContent = '错误: ' + e; }
};

$('pauseBtn').onclick = async () => {
  const p = await invoke('recording_progress');
  if (p && p.state === 'paused') { await invoke('resume_recording'); setUI('recording'); }
  else { await invoke('pause_recording'); setUI('paused'); }
};

$('stopBtn').onclick = async () => {
  const path = await invoke('stop_recording');
  recording = false;
  clearInterval(timerHandle);
  setUI('idle');
  $('statusHint').textContent = '已保存 → ' + path;
  loadHistory();
};

$('sourceKind').onchange = loadSources;
$('quality').onchange = updateQualityUI;
window.addEventListener('change', persist);

(async () => {
  const s = await invoke('get_settings');
  fillSettings(s);
  loadHistory();
  window.__TAURI__.event.listen('recording-progress', e => {
    const p = e.payload;
    if (recording) { $('timer').textContent = fmt(p.duration_secs); setUI(p.state); }
  });
})();
</script>
</body>
</html>
