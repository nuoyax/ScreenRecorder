<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Toolbar</title>
<style>
  :root {
    --bg: rgba(26,28,34,.92); --accent: #3b82f6; --accent2: #ef4444;
    --warn: #d97706; --text: #e5e7eb; --muted: #9ca3af; --border: #343845;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: transparent; color: var(--text);
    font-family: "Segoe UI", sans-serif; font-size: 13px; overflow: hidden;
  }
  #bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 12px; backdrop-filter: blur(8px);
    -webkit-app-region: drag;
  }
  button {
    -webkit-app-region: no-drag; border: none; border-radius: 50%;
    width: 34px; height: 34px; font-size: 14px; cursor: pointer; color: #fff;
  }
  button:disabled { opacity: .4; cursor: default; }
  #recBtn { background: var(--accent2); }
  #pauseBtn { background: var(--warn); width: 30px; height: 30px; font-size: 12px; }
  #stopBtn { background: #3f4451; }
  #mainBtn { background: #3f4451; font-size: 11px; }
  #timer {
    font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent2);
    min-width: 44px; text-align: center; -webkit-app-region: no-drag;
  }
  #timer.paused { color: var(--warn); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .dot.rec { background: var(--accent2); animation: blink 1s infinite; }
  .dot.paused { background: var(--warn); }
  @keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>
<div id="bar">
  <span class="dot" id="dot"></span>
  <span id="timer">00:00</span>
  <button id="recBtn" title="开始/停止">●</button>
  <button id="pauseBtn" title="暂停/恢复" disabled>⏸</button>
  <button id="stopBtn" title="停止并保存" disabled>■</button>
  <button id="mainBtn" title="打开主窗口">⊞</button>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;
const { getCurrentWindow } = window.__TAURI__.window;
const $ = id => document.getElementById(id);
let recording = false;

function fmt(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function setUI(state) {
  const dot = $('dot');
  dot.className = 'dot' + (state === 'recording' ? ' rec' : state === 'paused' ? ' paused' : '');
  $('timer').className = state === 'paused' ? 'paused' : '';
  $('recBtn').disabled = recording;
  $('pauseBtn').disabled = !recording;
  $('stopBtn').disabled = !recording;
  $('pauseBtn').textContent = state === 'paused' ? '▶' : '⏸';
}

$('recBtn').onclick = async () => {
  try {
    await invoke('start_recording');
    recording = true;
    setUI('recording');
  } catch (e) { console.error(e); }
};
$('pauseBtn').onclick = async () => {
  const p = await invoke('recording_progress');
  if (p && p.state === 'paused') { await invoke('resume_recording'); setUI('recording'); }
  else { await invoke('pause_recording'); setUI('paused'); }
};
$('stopBtn').onclick = async () => {
  await invoke('stop_recording');
  recording = false;
  setUI('idle');
  $('timer').textContent = '00:00';
};
$('mainBtn').onclick = async () => {
  const { Window } = window.__TAURI__.window;
  const w = await Window.getByLabel('main');
  if (w) { await w.show(); await w.setFocus(); }
};

listen('recording-progress', e => {
  const p = e.payload;
  if (p.state !== 'idle') {
    recording = p.state !== 'idle';
    $('timer').textContent = fmt(p.duration_secs);
    setUI(p.state);
  }
});
</script>
</body>
</html>
